# =============================================================================
# Test profile configuration
# Forces FakeLlmClient so tests never make real external Gemini calls
# and no real GEMINI_API_KEY is needed.
# =============================================================================
careerpilot:
  is-test: true

spring:
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:careerpilot_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

LLM_PROVIDER: fake
llm:
  provider: fake
  api-key: test-api-key
  model: gemini-1.5-flash
  timeout-seconds: 3
  rate-limit:
    capacity: 3
    refill-tokens: 3
    refill-duration-seconds: 60
  cache:
    ttl-minutes: 5
    max-size: 100

resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 4
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 1
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

logging:
  level:
    root: WARN
    com.careerpilot: INFO
    org.flywaydb: INFO
