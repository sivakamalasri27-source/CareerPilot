spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerpilot}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:careerpilot_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:careerpilot_secret}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CareerPilotHikariProdPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: WARN
    com.careerpilot: INFO
    org.flywaydb: INFO
