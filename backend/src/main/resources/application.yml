spring:
  application:
    name: careerpilot-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000} # 7 days

llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${LLM_API_KEY:${GEMINI_API_KEY:}}
  model: ${LLM_MODEL:gemini-1.5-flash}
  timeout-seconds: 15
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:20}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}
  cache:
    ttl-minutes: 60
    max-size: 1000

resilience4j:
  circuitbreaker:
    instances:
      llmService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-}] - %msg%n"
  level:
    root: INFO
    com.careerpilot: DEBUG
