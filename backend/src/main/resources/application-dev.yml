spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:careerpilot}
    username: ${DB_USER:careerpilot_user}
    password: ${DB_PASSWORD:careerpilot_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CareerPilotHikariDevPool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.flywaydb: INFO
