spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/careerpilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8085}

llm:
  provider: ${LLM_PROVIDER:fake}
  api-key: ${GEMINI_API_KEY:mock-key}

logging:
  level:
    root: INFO
    com.careerpilot: INFO
    org.flywaydb: INFO
