version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careerpilot}
      POSTGRES_USER: ${DB_USER:-careerpilot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careerpilot_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-careerpilot_user} -d ${DB_NAME:-careerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - careerpilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerpilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-careerpilot}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-careerpilot_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-careerpilot_secret}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:80}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      - careerpilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: careerpilot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - careerpilot-network

volumes:
  postgres_data:
    driver: local

networks:
  careerpilot-network:
    driver: bridge
