version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-careerpilot}
      POSTGRES_USER: ${DB_USER:-careerpilot_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-careerpilot_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-careerpilot_user} -d ${DB_NAME:-careerpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
